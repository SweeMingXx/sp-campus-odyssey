name: Verify campus
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test progression, world connectivity and HTTP security
        run: node --test tests/*.test.mjs
      - name: Build dependency-free static game
        run: node scripts/build.mjs
      - name: Install isolated browser test tooling
        run: npm install --no-save --package-lock=false @playwright/test@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile WebGL gameplay
        run: npx playwright test
      - name: Preserve browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Package static deployment
        uses: actions/upload-artifact@v4
        with:
          name: campus-odyssey-site
          path: dist/
